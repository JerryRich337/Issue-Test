services:
  postgres:
    image: postgres:16
    container_name: support-sim-postgres
    environment:
      POSTGRES_DB: support_sim
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_sim"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
